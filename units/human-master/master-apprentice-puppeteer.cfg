#textdomain wesnoth-Era_of_Strings

[unit_type]
    id=Apprentice Puppeteer
    name= _ "Apprentice Puppeteer"
    race=master
    image="units/master/apprentice-puppeteer.png"
    ellipse="misc/ellipse"

    hitpoints=34
    movement_type=normalfoot
    movement=7
    experience=35
    level=1
    alignment=lawful
    advances_to=null
    cost=20
    usage=fighter
    description= _ "New recruits to the Puppet Masters Association are taken on as apprentices to more senior puppeteers, learning the craft from seasoned veterans. Most of their time is spent studying existing designs and performing the maintenance mandatory to keep the wheels of industry turning in Victrus. While not a strict requirement per se, the level of engineering expertise that is expected of a potential apprentice often limits their membership to the higher classes of society, prime targets of any Sweepers aiming to make it big off a ransom payment. While many current Apprentices no doubt have the skill in Puppetcraft to graduate their apprenticeships, promotion to higher echelons of the guild requires a level of political acumen from both the student and the master that keeps many stuck at this stage for years. 
    
    For purposes of self defence, the strings of Puppeteers, normally used to control Puppets and safely interface with their clockwork, are sharp and thin enough to cut through flesh and bone with the right technique. Apprentices tend to use a protective gauntlet and blunted, low quality strings that take some effort to cut with, both of which help to avoid self injury as they learn the art. In an emergency, Apprentices can also throw the contents of their toolbelt at any approaching threats."
    [abilities]
        {ABILITY_EOST_REPAIR 6}
    [/abilities]
    [attack]
        name=Pocket knife
        description=_"Blunted Puppet String"
        icon=attacks/dagger-human.png
        type=blade
        range=melee
        damage=6
        number=2
        [specials]
        [/specials]
    [/attack]
    [attack]
        name=Thrown wrench
        description=_"Thrown wrench"
        icon=attacks/rock_thrown.png
        type=impact
        range=ranged
        damage=7
        number=1
        [specials]
        [/specials]
    [/attack]
[/unit_type]

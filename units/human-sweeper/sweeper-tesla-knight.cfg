#textdomain wesnoth-Era_of_Strings

[unit_type]
    id=Tesla Knight
    name= _ "Tesla Knight"
    race=sweeper
    image="units/placeholder/stickman.png"
    ellipse="misc/ellipse"

    hitpoints=34
    movement_type=normalfoot
    movement=7
    experience=35
    level=1
    alignment=lawful
    advances_to=null
    cost=20
    usage=fighter
    description= _ "The corporate wars have been of incredible interest to many veteran Scavengers, giving them an avenue to obtain the newest and most advanced technology from those dangerous battlefields, often times while the fighting is still on-going. Tesla Knights are the Scavengers who stripped enough Puppet Masters Association gear clean to fashion it to themselves, wearing heavy suits of plated armour designed to offer protection from weapons and lightning alike. While they share nothing in common personality wise with the knights of old, the nickname still caught on regardless.
    
    Due to the heavy weight of all their gear, the lightning cackling on their backs serves both as a weapon and a source of power for the assistant hydraulics of their suits. Said lightning can be discharged at far away targets, or focused into their gauntlets for a devestating punch, but regardless, a Tesla Knight must make sure to pace themselves appropriately, lest they risk trapping themselves in a steel coffin of their own makings."
    [abilities]
    [/abilities]
    [attack]
        name=sword
        description=_"Gun bash"
        icon=attacks/longsword.png
        type=blade
        range=melee
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
    [/attack]
    [attack]
        name=fangs
        description=_"Makeshift flechette gun"
        icon=attacks/fangs.png
        type=pierce
        range=melee
        damage=8
        number=2
        [specials]
            {WEAPON_SPECIAL_DRAIN}
            {WEAPON_SPECIAL_POISON}
            {WEAPON_SPECIAL_PLAGUE}
        [/specials]
    [/attack]
[/unit_type]
